name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A77CDB: ${{ secrets.A77CDB }}
          B86C47: ${{ secrets.B86C47 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A77CDB', '')
          tag_b = os.environ.get('B86C47', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- f424a5ab5113f69c7af06b909df6e935dcd88ef7 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 1ae2ce4f636c304b87869eae98d9fa6253657a4c -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
